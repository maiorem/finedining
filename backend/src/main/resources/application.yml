spring:
  application:
    name: finediningtheater
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 10
      max-lifetime: 1500000 # 25min, RDS wait_timeout보다 짧게 (CLAUDE.md §13.4)
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
  security:
    oauth2:
      client:
        registration:
          # 일반 회원(카카오) 로그인 (CLAUDE.md §3.1·§7.4). client-id/secret 기본값은 JWT_SECRET과
          # 같은 방식의 로컬 전용 placeholder다 — Spring의 ClientRegistration은 clientId가
          # 비어 있으면 부팅 자체를 거부하므로 빈 문자열을 기본값으로 두면 안 된다. placeholder로
          # 뜨는 건 문제 없지만, 실제 카카오 앱을 등록하기 전까지는 로그인 시도 자체가
          # invalid_client로 실패한다 — 그건 정상이다. redirect-uri를 /api/oauth2/** 아래로
          # 몰아서 프론트 라우트("/login")와 겹치지 않게 한다(SecurityConfig 참고).
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-dev-placeholder-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-dev-placeholder-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/oauth2/callback/{registrationId}"
            # account_email은 카카오 콘솔에서 별도 동의를 받아야 하고, 사용자가 거부하면 어차피
            # null로 온다(§7.4) — 실패로 취급하지 않는다.
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  # 카카오 로그인 성공/실패 리다이렉트 대상. 로컬 dev는 vite 프록시 포트(§14) — 이 값을 통해서만
  # 프론트로 되돌아가야 refresh 쿠키가 admin 로그인과 같은 원점(5173)에 남는다.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  signup:
    # 가입 정책은 코드가 아니라 설정이다(§3.2) — SignupPolicy 한 곳만 이 값을 읽는다.
    policy: ${SIGNUP_POLICY:OPEN}
    # local-login(§13.9, dev 전용 이메일·비밀번호 로그인 대체 경로)은 아직 구현 전이다 — 이
    # 플래그는 다음 단계를 위해 자리만 잡아둔다.
    local-login: ${SIGNUP_LOCAL_LOGIN:false}
  jwt:
    # prod/dev는 SSM Parameter Store에서 환경변수로 주입한다 (CLAUDE.md §13.7). 여기 기본값은
    # 로컬 개발 전용 placeholder다 — 절대 이 값 그대로 배포하지 않는다.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-before-any-real-deploy-32bytes-min}
    access-token-validity-minutes: 15
    refresh-token-validity-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    # 예약 URL은 저장 시 호스트 화이트리스트로 검증한다 — 오타 하나로 예약이 통째로 죽는다
    # (CLAUDE.md §4). 네이버 예약 도메인만 기본 허용한다.
    allowed-hosts: ${BOOKING_ALLOWED_HOSTS:booking.naver.com,m.booking.naver.com}
  web:
    # nginx와 공유하는 web-dist 볼륨 안의 index.html 경로(§10, docker-compose.yml 참고).
    # 로컬 개발(pnpm dev)은 이 파일이 없어도 된다 — IndexHtmlFilter가 조용히 통과시킨다.
    index-html-path: ${WEB_DIST_INDEX_PATH:/web-dist/index.html}
  media:
    s3:
      # 로컬은 MinIO, dev/prod는 환경변수로 실제 AWS S3 엔드포인트를 비운다(엔드포인트 오버라이드
      # 없으면 SDK가 기본 AWS 엔드포인트를 쓴다). CLAUDE.md §7.5·§13.7.
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:fdt-media-local}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      # MinIO는 path-style만 지원한다. 실제 AWS S3는 false로 바꾼다.
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/fdt-media-local}
      # 로컬 MinIO는 버킷을 미리 안 만들어도 되게 앱이 직접 만든다. 실제 AWS 계정은 버킷 생성
      # 권한을 앱에 주지 않으므로 dev/prod에서는 반드시 false로 둔다.
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
