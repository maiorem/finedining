# CLAUDE.md §13.2 — index.html은 Spring이 라우트별 메타를 주입해서 서빙한다(§10, Phase 2에서 구현).
# 그래서 nginx가 try_files로 index.html을 직접 내려주면 SEO가 죽는다.
# 확장자가 있는 빌드 산출물만 nginx가 직접 서빙하고, 나머지 문서 요청은 전부 backend로 넘긴다.

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # backend.yml의 배포는 backend 컨테이너만 재생성한다(nginx는 그대로 둔다, §13.6 파이프라인
    # 분리) — 그런데 proxy_pass에 호스트명을 그대로 쓰면 nginx가 시작 시점에 DNS를 한 번만
    # 풀어 IP를 캐시해버려서, 컨테이너가 바뀌어 IP가 달라지면 nginx는 죽은 IP로 계속 연결을
    # 시도해 502가 난다(실제로 겪은 장애). Docker 내장 DNS(127.0.0.11)를 resolver로 쓰고
    # proxy_pass를 변수로 넘겨야 매 요청(정확히는 resolver 캐시 TTL마다) 다시 조회한다.
    resolver 127.0.0.11 valid=10s;

    # text/html은 nginx가 gzip 모듈에서 항상 기본 포함하므로 여기 다시 적지 않는다
    # (적으면 "duplicate MIME type" 경고가 뜬다).
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # 1) 확장자가 있는 요청 = 빌드 산출물. nginx가 직접, 장기 캐시.
    location ~* \.(js|css|woff2|png|jpg|jpeg|webp|svg|ico|json|txt|xml)$ {
        root /srv/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2) API
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront는 뷰어에게 항상 HTTPS를 강제하고(redirect-to-https) 오리진(nginx)과는
        # HTTP로만 통신한다(§13.3, HTTP Only 오리진 정책). 이 홉에서 프로토콜이 바뀌는 걸
        # Spring에 알려주지 않으면 OAuth2 redirect_uri가 http://로 생성돼 카카오가 거부한다.
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3) 나머지 전부 = HTML 문서 요청. Spring이 메타를 주입해 반환한다.
    location / {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront는 뷰어에게 항상 HTTPS를 강제하고(redirect-to-https) 오리진(nginx)과는
        # HTTP로만 통신한다(§13.3, HTTP Only 오리진 정책). 이 홉에서 프로토콜이 바뀌는 걸
        # Spring에 알려주지 않으면 OAuth2 redirect_uri가 http://로 생성돼 카카오가 거부한다.
        proxy_set_header X-Forwarded-Proto https;
    }
}
