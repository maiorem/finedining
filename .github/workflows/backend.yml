# backend/ 변경에만 반응한다 — 프론트만 고치면 이 워크플로는 아예 안 돈다 (CLAUDE.md §13.6).
#
# deploy 잡은 AWS 쪽 설정이 끝나야 실제로 동작한다. 저장소 Settings에 아래를 채워 넣는다:
#   Secrets   : AWS_DEPLOY_ROLE_ARN  (GitHub OIDC로 assume할 IAM 역할, §13.7)
#   Variables : AWS_REGION           예: ap-northeast-2
#               ECR_REPOSITORY       예: finedining-backend
#               EC2_SSM_INSTANCE_ID  배포 대상 EC2 인스턴스 ID
# 이 값들이 비어 있어도 test 잡은 정상적으로 통과한다 — deploy 잡만 건너뛴다.

name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle wrapper cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}

      - run: ./gradlew test --no-daemon
      - run: ./gradlew build --no-daemon -x test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC — 장기 액세스 키를 Secrets에 두지 않는다 (§13.6)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG - decode OIDC token claims (temporary, remove after diagnosis)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import base64,json; p='$TOKEN'.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['aud','sub','iss','repository','ref','environment']}, indent=2))"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push (linux/arm64, tag=commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSM Run Command
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ssm send-command \
            --instance-ids "${{ vars.EC2_SSM_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "backend deploy ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"cd /opt/finedining\",
              \"export BACKEND_IMAGE=$IMAGE\",
              \"docker compose pull backend\",
              \"docker compose up -d backend\"
            ]}" \
            --output text
