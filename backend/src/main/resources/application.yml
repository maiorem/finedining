spring:
  application:
    name: finediningtheater
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 10
      max-lifetime: 1500000 # 25min, RDS wait_timeout보다 짧게 (CLAUDE.md §13.4)
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

app:
  jwt:
    # prod/dev는 SSM Parameter Store에서 환경변수로 주입한다 (CLAUDE.md §13.7). 여기 기본값은
    # 로컬 개발 전용 placeholder다 — 절대 이 값 그대로 배포하지 않는다.
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-before-any-real-deploy-32bytes-min}
    access-token-validity-minutes: 15
    refresh-token-validity-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
